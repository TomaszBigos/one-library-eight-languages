<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Moduły: biblioteka, dane, adaptery, porty</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4842"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#1d1c1a">Moduły: biblioteka, dane, adaptery, porty</text>
<rect x="15" y="48" width="930" height="104" rx="10" fill="none" stroke="#8a6a2f" stroke-dasharray="5 4" stroke-opacity="0.7"/>
<text x="27" y="66" font-size="12" font-weight="600" fill="#8a6a2f">Studia przypadku: biblioteka w typowym otoczeniu (Spring Boot, Camel)</text>
<rect x="30" y="76" width="210" height="48" rx="6" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="1.3"/>
<text x="38" y="96" font-size="13" font-weight="600" fill="#1d1c1a">nsa-file-monitor</text>
<text x="38" y="113" font-size="12" fill="#3d3b37">folder → raport JSON (pl)</text>
<rect x="260" y="76" width="210" height="48" rx="6" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="1.3"/>
<text x="268" y="96" font-size="13" font-weight="600" fill="#1d1c1a">nsa-service-polish</text>
<text x="268" y="113" font-size="12" fill="#3d3b37">REST, port 8080</text>
<rect x="490" y="76" width="210" height="48" rx="6" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="1.3"/>
<text x="498" y="96" font-size="13" font-weight="600" fill="#1d1c1a">nsa-service-malagasy</text>
<text x="498" y="113" font-size="12" fill="#3d3b37">REST, port 8081</text>
<rect x="720" y="76" width="210" height="48" rx="6" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="1.3"/>
<text x="728" y="96" font-size="13" font-weight="600" fill="#1d1c1a">nsa-stream-example</text>
<text x="728" y="113" font-size="12" fill="#3d3b37">pula wątków, Kafka, pomiary</text>
<rect x="15" y="172" width="930" height="230" rx="10" fill="none" stroke="#4a7a3d" stroke-dasharray="5 4" stroke-opacity="0.7"/>
<text x="27" y="190" font-size="12" font-weight="600" fill="#4a7a3d">Biblioteka: czysta Java, bez Springa; ten sam podział w każdym porcie</text>
<rect x="30" y="205" width="200" height="65" rx="6" fill="#f3eef6" stroke="#6b4a8a" stroke-width="1.3"/>
<text x="38" y="225" font-size="13" font-weight="600" fill="#1d1c1a">nsa-data-polish</text>
<text x="38" y="242" font-size="12" fill="#3d3b37">jar z danymi: kategorie,</text>
<text x="38" y="259" font-size="12" fill="#3d3b37">listy słów, wzorce pl</text>
<rect x="255" y="205" width="215" height="65" rx="6" fill="#eef5ec" stroke="#4a7a3d" stroke-width="1.3"/>
<text x="263" y="225" font-size="13" font-weight="600" fill="#1d1c1a">nsa-polish</text>
<text x="263" y="242" font-size="12" fill="#3d3b37">PolishClassifier, PolishConfig,</text>
<text x="263" y="259" font-size="12" fill="#3d3b37">słownik PoliMorf (morfologik)</text>
<rect x="490" y="205" width="215" height="65" rx="6" fill="#eef5ec" stroke="#4a7a3d" stroke-width="1.3"/>
<text x="498" y="225" font-size="13" font-weight="600" fill="#1d1c1a">nsa-malagasy</text>
<text x="498" y="242" font-size="12" fill="#3d3b37">MalagasyClassifier,</text>
<text x="498" y="259" font-size="12" fill="#3d3b37">morfologia i wzorce mg</text>
<rect x="730" y="205" width="200" height="65" rx="6" fill="#f3eef6" stroke="#6b4a8a" stroke-width="1.3"/>
<text x="738" y="225" font-size="13" font-weight="600" fill="#1d1c1a">nsa-data-malagasy</text>
<text x="738" y="242" font-size="12" fill="#3d3b37">jar z danymi: kategorie,</text>
<text x="738" y="259" font-size="12" fill="#3d3b37">korpusy, wzorce mg</text>
<rect x="230" y="318" width="500" height="65" rx="6" fill="#e8eef6" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="238" y="338" font-size="13" font-weight="600" fill="#1d1c1a">nsa-core (bez danych)</text>
<text x="238" y="355" font-size="12" fill="#3d3b37">NSA i detektory, indeksy, słownik obcy, cache detektorów,</text>
<text x="238" y="372" font-size="12" fill="#3d3b37">wspólne sygnały dokumentu: pisma, wstawki, homoglify, marki</text>
<rect x="30" y="440" width="440" height="65" rx="6" fill="#fbecec" stroke="#9a4040" stroke-width="1.3"/>
<text x="38" y="460" font-size="13" font-weight="600" fill="#1d1c1a">Porty tej samej biblioteki</text>
<text x="38" y="477" font-size="12" fill="#3d3b37">Kotlin, Scala (JVM) · Rust · C# · Go · C++ · TypeScript</text>
<text x="38" y="494" font-size="12" fill="#3d3b37">te same dane, te same odpowiedzi (bramka równoważności)</text>
<rect x="490" y="440" width="440" height="65" rx="6" fill="#f3f2ef" stroke="#6b6862" stroke-width="1.3"/>
<text x="498" y="460" font-size="13" font-weight="600" fill="#1d1c1a">Narzędzia obok biblioteki</text>
<text x="498" y="477" font-size="12" fill="#3d3b37">bramki jakości i równoważności, pomiary (Python);</text>
<text x="498" y="494" font-size="12" fill="#3d3b37">materiał od modeli językowych zbierany tylko offline</text>
