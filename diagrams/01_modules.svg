<line x1="365" y1="124" x2="362" y2="205" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="595" y1="124" x2="598" y2="205" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="825" y1="124" x2="598" y2="205" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="825" y1="124" x2="362" y2="205" stroke="#4a4842" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<line x1="255" y1="238" x2="230" y2="238" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="705" y1="238" x2="730" y2="238" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="362" y1="270" x2="480" y2="318" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="598" y1="270" x2="480" y2="318" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="945" y="545" font-size="12" text-anchor="end" fill="#6b6862">strzałka = zależność (kto kogo używa); każdy pipeline w osobnym jarze, bez danych drugiego języka</text>
</svg>
