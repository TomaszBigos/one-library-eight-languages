<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Jak pracowało AI: człowiek, agent, pliki pamięci, bramki</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4842"/></marker></defs>
<rect width="960" height="450" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#1d1c1a">Jak pracowało AI: człowiek, agent, pliki pamięci, bramki</text>
<rect x="30" y="60" width="250" height="65" rx="6" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="1.3"/>
<text x="38" y="80" font-size="13" font-weight="600" fill="#1d1c1a">Człowiek</text>
<text x="38" y="97" font-size="12" fill="#3d3b37">cel, decyzje, przegląd wyników;</text>
<text x="38" y="114" font-size="12" fill="#3d3b37">commit robi człowiek</text>
<rect x="360" y="60" width="250" height="65" rx="6" fill="#e8eef6" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="368" y="80" font-size="13" font-weight="600" fill="#1d1c1a">Agent AI (Claude Code)</text>
<text x="368" y="97" font-size="12" fill="#3d3b37">kod, testy, narzędzia, pomiary,</text>
<text x="368" y="114" font-size="12" fill="#3d3b37">raporty i dzienniki</text>
<rect x="680" y="42" width="265" height="228" rx="10" fill="none" stroke="#6b6862" stroke-dasharray="5 4" stroke-opacity="0.7"/>
<text x="692" y="60" font-size="12" font-weight="600" fill="#6b6862">Pliki pamięci (czyta i uzupełnia)</text>
<rect x="695" y="72" width="235" height="48" rx="6" fill="#f3f2ef" stroke="#6b6862" stroke-width="1.3"/>
<text x="703" y="92" font-size="13" font-weight="600" fill="#1d1c1a">CLAUDE.md</text>
<text x="703" y="109" font-size="12" fill="#3d3b37">gdzie co leży, komendy, pułapki</text>
<rect x="695" y="120" width="235" height="48" rx="6" fill="#f3f2ef" stroke="#6b6862" stroke-width="1.3"/>
<text x="703" y="140" font-size="13" font-weight="600" fill="#1d1c1a">TODO.md</text>
<text x="703" y="157" font-size="12" fill="#3d3b37">lista zadań z odhaczaniem</text>
<rect x="695" y="168" width="235" height="48" rx="6" fill="#f3f2ef" stroke="#6b6862" stroke-width="1.3"/>
<text x="703" y="188" font-size="13" font-weight="600" fill="#1d1c1a">dzienniki i backlog</text>
<text x="703" y="205" font-size="12" fill="#3d3b37">każdy pomiar i stan na koniec</text>
<rect x="695" y="216" width="235" height="48" rx="6" fill="#f3f2ef" stroke="#6b6862" stroke-width="1.3"/>
<text x="703" y="236" font-size="13" font-weight="600" fill="#1d1c1a">pamięć agenta</text>
<text x="703" y="253" font-size="12" fill="#3d3b37">preferencje i ustalenia</text>
<rect x="30" y="330" width="190" height="48" rx="6" fill="#eef5ec" stroke="#4a7a3d" stroke-width="1.3"/>
