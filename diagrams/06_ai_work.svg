<text x="578" y="384" font-size="12" fill="#3d3b37">snapshoty JSON</text>
<rect x="820" y="330" width="125" height="65" rx="6" fill="#f6f1e7" stroke="#8a6a2f" stroke-width="1.3"/>
<text x="828" y="350" font-size="13" font-weight="600" fill="#1d1c1a">publish/</text>
