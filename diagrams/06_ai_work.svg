<text x="320" y="96" font-size="12" text-anchor="middle" fill="#4a4842">polecenie</text>
<line x1="610" y1="92" x2="695" y2="96" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="485" y1="125" x2="125" y2="330" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="220" y1="354" x2="290" y2="362" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="390" y1="330" x2="485" y2="125" stroke="#4a4842" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<rect x="331" y="218" width="213" height="18" rx="3" fill="#ffffff"/>
<text x="438" y="230" font-size="12" text-anchor="middle" fill="#4a4842">różnica: poprawka albo cofnięcie</text>
<line x1="490" y1="362" x2="570" y2="362" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="500" y="352" width="59" height="18" rx="3" fill="#ffffff"/>
<text x="530" y="366" font-size="12" text-anchor="middle" fill="#4a4842">0 różnic</text>
<line x1="760" y1="362" x2="820" y2="362" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="30" y="432" font-size="12" text-anchor="start" fill="#6b6862">Pliki pamięci przenoszą stan między sesjami: kontekst agenta się kończy, repozytorium zostaje.</text>
</svg>
