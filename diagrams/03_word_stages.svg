<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 696" width="960" height="696" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Klasyfikacja słowa: etapy w stałej kolejności</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4842"/></marker></defs>
<rect width="960" height="696" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#1d1c1a">Klasyfikacja słowa: etapy w stałej kolejności</text>
<text x="40" y="62" font-size="13" text-anchor="start" fill="#1d1c1a">polski (PolishClassifier)</text>
<rect x="40" y="76" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="96" font-size="12" fill="#3d3b37">WHITELIST — 375 form zamkniętych (spójniki, przyimki…)</text>
<rect x="40" y="124" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="144" font-size="12" fill="#3d3b37">DICTIONARY — słownik fleksyjny PoliMorf</text>
<line x1="240" y1="107" x2="240" y2="124" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="40" y="172" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="192" font-size="12" fill="#3d3b37">FOREIGN_DICT — słowa obce, 52 języki</text>
<line x1="240" y1="155" x2="240" y2="172" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="40" y="220" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="240" font-size="12" fill="#3d3b37">ROUTER — nieznane słowo do 4 znaków → NEUTRAL</text>
<line x1="240" y1="203" x2="240" y2="220" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="40" y="268" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="288" font-size="12" fill="#3d3b37">HOMOGLYPH — litery podmienione z innego pisma</text>
<line x1="240" y1="251" x2="240" y2="268" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="40" y="316" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="336" font-size="12" fill="#3d3b37">BRAND_TYPOSQUAT — podróbka nazwy marki</text>
<line x1="240" y1="299" x2="240" y2="316" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="40" y="364" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="384" font-size="12" fill="#3d3b37">TYPO — literówka słowa ze zbioru (odległość ≤ 2)</text>
<line x1="240" y1="347" x2="240" y2="364" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="40" y="412" width="400" height="31" rx="6" fill="#e8eef6" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="48" y="432" font-size="12" fill="#3d3b37">NSA — detektory kategorii (rysunek 2)</text>
<line x1="240" y1="395" x2="240" y2="412" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="520" y="62" font-size="13" text-anchor="start" fill="#1d1c1a">malgaski (MalagasyClassifier)</text>
<rect x="520" y="76" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="96" font-size="12" fill="#3d3b37">WHITELIST — 74 formy zamknięte</text>
<rect x="520" y="124" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="144" font-size="12" fill="#3d3b37">SHORT_FOREIGN — krótkie słowa angielskie</text>
<line x1="720" y1="107" x2="720" y2="124" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="172" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="192" font-size="12" fill="#3d3b37">CATEGORY_DATASET — zbiór kategorii</text>
<line x1="720" y1="155" x2="720" y2="172" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="220" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="240" font-size="12" fill="#3d3b37">DICTIONARY — słownik z korpusu Wikipedii mg</text>
<line x1="720" y1="203" x2="720" y2="220" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="268" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="288" font-size="12" fill="#3d3b37">LEGAL — słownictwo z korpusu aktów prawnych</text>
<line x1="720" y1="251" x2="720" y2="268" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="316" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="336" font-size="12" fill="#3d3b37">MORPHOLOGY — odwrotna mutacja złożeń</text>
<line x1="720" y1="299" x2="720" y2="316" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="364" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="384" font-size="12" fill="#3d3b37">AFFIX — afiksy słowotwórcze</text>
<line x1="720" y1="347" x2="720" y2="364" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="412" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="432" font-size="12" fill="#3d3b37">FOREIGN_DICT — słowa obce, 39 języków</text>
<line x1="720" y1="395" x2="720" y2="412" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="460" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="480" font-size="12" fill="#3d3b37">HOMOGLYPH — litery podmienione z innego pisma</text>
<line x1="720" y1="443" x2="720" y2="460" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="508" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="528" font-size="12" fill="#3d3b37">BRAND_TYPOSQUAT — podróbka nazwy marki</text>
<line x1="720" y1="491" x2="720" y2="508" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="556" width="400" height="31" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="576" font-size="12" fill="#3d3b37">ROUTER — nieznane krótkie słowo → NEUTRAL</text>
<line x1="720" y1="539" x2="720" y2="556" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="520" y="604" width="400" height="31" rx="6" fill="#e8eef6" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="528" y="624" font-size="12" fill="#3d3b37">NSA — detektory kategorii (rysunek 2)</text>
<line x1="720" y1="587" x2="720" y2="604" stroke="#4a4842" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="40" y="484" font-size="12" text-anchor="start" fill="#6b6862">Pierwszy etap, który rozstrzyga, kończy klasyfikację słowa;</text>
<text x="40" y="501" font-size="12" text-anchor="start" fill="#6b6862">pole „via” w odpowiedzi mówi, który to był. Kolejność</text>
<text x="40" y="518" font-size="12" text-anchor="start" fill="#6b6862">jest częścią algorytmu: zmiana kolejności zmienia wyniki.</text>
</svg>
